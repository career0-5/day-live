  #wrap{ transform-origin:center center; padding:10px; width:max-content; }

  /* 상단: 로고(좌) · 제목(우) — 로고 높이는 제목에 맞춤 */
  #header{ display:flex; align-items:flex-end; justify-content:space-between; width:1720px; margin:0 0 12px; }
  #logo img{ display:block; height:150px; width:auto; }
  #header h1{ margin:0; font-size:79px; font-weight:800; letter-spacing:-.02em; color:#0e5c63; line-height:1;
              text-shadow:0 1px 3px rgba(255,255,255,.95); white-space:nowrap; }

  table{ border-collapse:collapse; margin:0 auto; table-layout:fixed; width:1720px; box-shadow:0 2px 16px rgba(0,0,0,.16); }
  th,td{ border:1px solid var(--line); padding:5px 8px; line-height:1.15; font-size:31px;
    white-space:nowrap; text-align:center; overflow:hidden; text-overflow:ellipsis; background:#fff; }
  td:first-child{ width:215px; }
  td.col1{ background:var(--col1); color:#fff; font-weight:800; }
  tr.hdrrow td{ font-weight:800; }                                   /* 머리글(순·농업…) 라벨 */
  tr.onsite td{ font-weight:800; font-size:46px; border:3px solid var(--line); }   /* 현장접수: 1.5배 + 굵은 테두리 */

  #banner{ width:100%; margin-top:12px; }
  #banner img{ display:block; width:46%; height:auto; margin:0 auto; }
  #status{ margin:8px auto 0; font-size:13px; color:#5f7f82; font-weight:600; text-align:center;
           text-shadow:0 1px 2px rgba(255,255,255,.9); }
  #status .dot{ color:#1B8A5A; } #status.err .dot{ color:#C0653B; }
</style>
</head>

function maskCell(v){
  const s=(v==null?"":String(v)).trim(); if(!s) return "";
  const K=/[\uAC00-\uD7A3]/.test(s), L=/[A-Za-z]/.test(s);
  if(K){ const c=Array.from(s); if(c.length<=1) return c[0]||""; if(c.length===2) return c[0]+"○"; return c[0]+"○".repeat(c.length-2)+c[c.length-1]; }
  if(L){ const c=Array.from(s); if(c.length<=2) return s; return c.slice(0,2).join("")+"○".repeat(c.length-2); }
  return s;
}
function esc(s){ return String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m])); }
function cell(v){ return (v==null?"":String(v)).trim(); }
function isNum(s){ return /^\d+$/.test(cell(s)); }

function render(grid, boldGrid){
  grid=grid||[];
  // 머리글 행 = 주제관 이름이 있는 행
  let headerRow = grid.findIndex(r=>(r||[]).some(v=>HALLS.some(k=>cell(v).indexOf(k)>=0)));
  if(headerRow<0){ return; }                       // 머리글 못 찾으면 현재 화면 유지(틀 보존)
  const hdr=grid[headerRow]||[];
  let sunCol=hdr.findIndex(v=>cell(v)==="순"); if(sunCol<0) sunCol=0;
  let cols=[sunCol], colColor=[""], hallCols=[], dispHdr=["순"];
  HALLS.forEach((k,i)=>{ const c=hdr.findIndex(v=>cell(v).indexOf(k)>=0);
    if(c>=0){ cols.push(c); colColor.push(HALL_PALETTE[i]); hallCols.push(c); dispHdr.push(cell(hdr[c])||HALL_LABELS[i]); } });
  let dataIdx=[]; for(let i=0;i<grid.length;i++){ if(isNum((grid[i]||[])[sunCol])) dataIdx.push(i); }

  // 응답이 깨졌으면(주제관 7개 미만 또는 데이터 부족) 반영하지 않음 → 전체 틀 유지
  if((hallCols.length<7 || dataIdx.length<10) && hasRendered) return;

  // 제목
  let title="";
  for(let i=0;i<headerRow;i++){ const r=grid[i]||[]; for(let c=0;c<r.length;c++){ const v=cell(r[c]); if(v && v.indexOf("현장")<0){ title=v; break; } } if(title) break; }
  document.getElementById("title").textContent = title || TITLE_DEFAULT;

  // 현장접수 행: '현장' 글자로 찾되, 글자가 비면(타입추론으로 지워진 경우)
  //              '머리글 바로 위/데이터 바로 아래'이면서 주제관 칸이 숫자인 행을 위치로 탐색
  let onsiteRow = grid.findIndex(r=>cell((r||[])[sunCol]).indexOf("현장")>=0);
  if(onsiteRow<0 && dataIdx.length){
    const cands=[headerRow-1, dataIdx[dataIdx.length-1]+1];
    for(const i of cands){ const r=grid[i]; if(r && !isNum(r[sunCol]) && hallCols.some(c=>isNum(r[c]))){ onsiteRow=i; break; } }
  }

  function tr(idx, kind){
    const row = grid[idx]||[];
    const brow = (boldGrid && boldGrid[idx]) || [];
    const cls = kind==="onsite" ? "onsite" : kind==="header" ? "hdrrow" : "";
    const tds = cols.map((c,p)=>{
      let raw = kind==="header" ? dispHdr[p] : cell(row[c]);
      let mark=false;
      if(kind==="data" && p>=1 && /^\s*\*/.test(raw)){ mark=true; raw=raw.replace(/^\s*\*\s*/,""); }   // 이름 앞 * → 굵게(대체자 구분, * 제거)
      if(p===0){ raw=String(raw).replace(/\s/g,""); if(kind==="onsite" && !raw) raw="현장접수"; if(kind==="header" && !raw) raw="순"; }
      const show=(kind==="data" && p>=1) ? maskCell(raw) : raw;
      const bold = (kind==="data" && p>=1 && (mark || brow[c])) ? "font-weight:900;" : "";   // 시트에서 굵게 쓴 이름 → 웹에서도 굵게
      const bg = p===0 ? "" : `background:${colColor[p]};`;
      return p===0 ? `<td class="col1" style="${bold}">${esc(show)}</td>` : `<td style="${bg}${bold}">${esc(show)}</td>`;
    }).join("");
    return `<tr class="${cls}">${tds}</tr>`;
  }

  // 항상 1행=현장접수 → 머리글 → 학생 16명 (틀 고정)
  let html="";
  if(onsiteRow>=0) html += tr(onsiteRow, "onsite");
  html += tr(headerRow, "header");
  dataIdx.forEach(i=> html += tr(i, "data"));
  document.querySelector("#tbl thead").innerHTML="";
  document.querySelector("#tbl tbody").innerHTML = html;
  hasRendered=true;
  fitToScreen();
}

function fitToScreen(){
  const wrap=document.getElementById("wrap");
  wrap.style.transform="none";
  const scale=Math.min(window.innerWidth/wrap.scrollWidth, window.innerHeight/wrap.scrollHeight)*FIT;
  wrap.style.transform=`scale(${scale})`;
}
window.addEventListener("resize", ()=>requestAnimationFrame(fitToScreen));
window.addEventListener("load", fitToScreen);

let firstLoad=true;
function setStatus(t,e){ const el=document.getElementById("status"); el.classList.toggle("err",!!e); document.getElementById("statusText").textContent=t; }
function buildGrid(resp){
  const t=resp.table||{};
  const body=(t.rows||[]).map(r=>(r.c||[]).map(c=> c ? (c.f!=null?c.f:(c.v==null?"":c.v)) : ""));
  const labels=(t.cols||[]).map(c=>(c&&c.label!=null)?String(c.label):"");
  return labels.some(x=>/[\uAC00-\uD7A3]/.test(String(x))) ? [labels, ...body] : body;
}
function parseCSV(text){
  const rows=[]; let row=[], f="", i=0, q=false;
  while(i<text.length){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ f+='"'; i+=2; continue; } q=false; i++; continue; } f+=ch; i++; continue; }
    if(ch==='"'){ q=true; i++; continue; }
    if(ch===','){ row.push(f); f=""; i++; continue; }
    if(ch==='\r'){ i++; continue; }
    if(ch==='\n'){ row.push(f); rows.push(row); row=[]; f=""; i++; continue; }
    f+=ch; i++;
  }
  if(f!=="" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function loadCSV(){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}&t=${Date.now()}`;
  return fetch(url).then(r=>{ if(!r.ok) throw new Error("csv"); return r.text(); })
    .then(txt=>{ const g=parseCSV(txt); if(g.length<4) throw new Error("empty");
      render(g); firstLoad=false; setStatus(`실시간 자동 갱신 · 마지막 갱신 ${new Date().toLocaleTimeString("ko-KR")}`,false); });
}
function loadJSONP(){
  const cb="gviz_"+Date.now();
  const timer=setTimeout(()=>{ cleanup(); if(firstLoad) setStatus("자동 갱신 대기 중 · 스냅샷 표시",true); },8000);
  function cleanup(){ delete window[cb]; const s=document.getElementById(cb); if(s) s.remove(); }
  window[cb]=function(resp){ clearTimeout(timer);
    try{ render(buildGrid(resp)); firstLoad=false; setStatus(`실시간 자동 갱신 · 마지막 갱신 ${new Date().toLocaleTimeString("ko-KR")}`,false); }
    catch(e){ if(firstLoad) setStatus("자동 갱신 대기 중 · 스냅샷 표시",true); } cleanup(); };
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&headers=0&tqx=out:json;responseHandler:${cb}&t=${Date.now()}`;
  const s=document.createElement("script"); s.id=cb; s.src=url;
  s.onerror=()=>{ clearTimeout(timer); if(firstLoad) setStatus("자동 갱신 대기 중 · 스냅샷 표시",true); cleanup(); };
  document.body.appendChild(s);
}
function loadAPI(){
  const fields="sheets(data(rowData(values(formattedValue,effectiveFormat(textFormat(bold))))))";
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?ranges=${encodeURIComponent(API_RANGE)}&fields=${encodeURIComponent(fields)}&key=${API_KEY}`;
  return fetch(url).then(r=>{ if(!r.ok) throw new Error("api "+r.status); return r.json(); })
    .then(j=>{
      const data=(((j.sheets||[])[0]||{}).data||[])[0]||{};
      const rows=data.rowData||[];
      const values=[], bold=[];
      rows.forEach(rd=>{ const cells=rd.values||[]; const vr=[], br=[];
        cells.forEach(c=>{ vr.push(c&&c.formattedValue!=null?c.formattedValue:""); br.push(!!(c&&c.effectiveFormat&&c.effectiveFormat.textFormat&&c.effectiveFormat.textFormat.bold)); });
        values.push(vr); bold.push(br); });
      if(values.length<4) throw new Error("empty");
      render(values, bold); firstLoad=false;
      setStatus(`실시간 자동 갱신(굵게 반영) · 마지막 갱신 ${new Date().toLocaleTimeString("ko-KR")}`,false);
    });
}
function loadValues(){
  if(!SHEET_ID){ setStatus("시트 ID 미입력 · 미리보기",true); return; }
  if(API_KEY){ loadAPI().catch(()=>loadCSV().catch(()=>loadJSONP())); }   // 키 있으면 굵게까지 반영
  else { loadCSV().catch(()=>loadJSONP()); }
}

render(SNAPSHOT);
setStatus("불러오는 중…",false);
loadValues();
setInterval(loadValues, REFRESH_MS);
</script>
